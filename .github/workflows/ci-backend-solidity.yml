name: CI — Backend Solidity

on:
  workflow_call:

jobs:
  backend-solidity:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      # Build only src contracts (path `contracts`), not test/script; also reports contract sizes.
      - name: Forge build
        run: |
          cd backend
          forge --version
          forge build --build-info --sizes contracts

      - name: Set up Python for Slither
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Run Slither on the runner rather than via crytic/slither-action: the action executes in a
      # container without Foundry, and crytic-compile shells out to `forge config --json` even with
      # ignore-compile, so it dies on "No such file or directory: 'forge'". Installing from
      # backend/poetry.lock also pins slither/crytic-compile instead of resolving latest each run.
      - name: Install Slither (pinned by backend/poetry.lock)
        run: |
          pipx install poetry
          cd backend
          poetry install --no-root

      # Reads backend/slither.config.json from the working directory.
      # --fail-pedantic matches the previous slither-action `fail-on: all` default.
      - name: Slither
        run: |
          cd backend
          poetry run slither . --fail-pedantic

      - name: Forge coverage
        run: |
          cd backend
          forge coverage -vvv --report lcov

      - name: Code coverage at 100% (Foundry)
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: "./backend/lcov.info"
          min_coverage: 100
